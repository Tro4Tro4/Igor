name: Prices daily
on:
  # Uso personale: solo avvio manuale; run_daily mantiene il limite giornaliero.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prices-import
  cancel-in-progress: false
jobs:
  daily:
    # Servizio prezzi online ritirato: conservato solo per riferimento.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/prices/requirements.lock
      - name: Acquire validated sources and publish batches
        run: python -m igor_prices.cloudflare.cli daily
        working-directory: services/prices
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
