name: Prices deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prices-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/prices/requirements.lock
      - run: python -m pytest -q
        working-directory: services/prices
      - run: npm ci --no-audit --no-fund
        working-directory: services/prices-cloudflare
      - run: npm run typecheck && npm test && npm run test:config && npm run dry-run
        working-directory: services/prices-cloudflare
      - name: Configure real database
        run: npm run configure
        working-directory: services/prices-cloudflare
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
      - name: Configure private API access
        run: |
          test ${#IGOR_PRICES_API_TOKEN} -ge 32
          printf '%s' "$IGOR_PRICES_API_TOKEN" | npx --no-install wrangler secret put PRIVATE_API_TOKEN --config wrangler.deploy.jsonc
        working-directory: services/prices-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
          IGOR_PRICES_API_TOKEN: ${{ secrets.IGOR_PRICES_API_TOKEN }}
      - name: Apply D1 migrations
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc
        working-directory: services/prices-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
      - name: Initialize source metadata
        run: python -m igor_prices.cloudflare.cli sync-sources
        working-directory: services/prices
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
      - name: Deploy read-only API
        run: npx --no-install wrangler deploy --config wrangler.deploy.jsonc
        working-directory: services/prices-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
