# I test JVM girano con una Application vuota invece di IgorApplication.
#
# IgorApplication.onCreate() pianifica il worker delle scadenze, e sotto Robolectric
# WorkManager non e' inizializzato (il suo ContentProvider di auto-init non parte):
# ogni test fallirebbe prima ancora di cominciare, per un motivo che non c'entra con
# cio' che sta verificando.
#
# Un test che debba invece esercitare IgorApplication — il suo onCreate() o il
# container di dependency injection che vi risiede — se la riprende dichiarando
# @Config(application = IgorApplication::class) sulla propria classe.
application=android.app.Application
